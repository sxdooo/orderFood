services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-orderfood}
      MYSQL_DATABASE: orderfood
    # Keep MySQL private to the compose network (no host port mapping in production).
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-orderfood}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: redis
    restart: unless-stopped
    # Enable password auth as on the existing server environment.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-orderfood}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orderfood}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: go-api
    restart: unless-stopped
    # Real secrets (WeChat AppSecret, Amap key, JWT secret, OSS) live in server/.env.
    # Create it on the server from server/.env.example before deploying.
    env_file:
      - ../server/.env
    # These overrides take precedence over server/.env and wire the app to the
    # compose-managed MySQL/Redis via their service DNS names (mysql / redis).
    environment:
      APP_ENV: production
      GIN_MODE: release
      HTTP_PORT: "4000"
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-orderfood}@tcp(mysql:3306)/orderfood?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orderfood}
      REDIS_DB: "0"
    # Expose the API directly on the host so it is reachable at <host>:4000.
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
