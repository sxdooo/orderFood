services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: orderfood
      MYSQL_DATABASE: orderfood
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ../server/.env.example
    environment:
      MYSQL_DSN: root:orderfood@tcp(mysql:3306)/orderfood?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
